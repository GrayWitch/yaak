name: Build Yaak App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        default: "windows-x64"
        options:
          - "windows-x64"
          - "macos-arm64"
          - "macos-x64"
          - "ubuntu-x64"
          - "all"
      create_release:
        description: "Create a GitHub Release with built binaries"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    if: github.event_name == 'push' || inputs.platform == 'windows-x64' || inputs.platform == 'all'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-win
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: vp install

      - name: Bootstrap
        run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: x64

      - name: Build Tauri Bundle
        shell: bash
        run: node scripts/run-build.mjs client --config crates-tauri/yaak-app-client/tauri.release.conf.json --no-sign --config '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}' --bundles nsis

      - name: Inspect and collect Windows artifacts
        shell: bash
        run: |
          mkdir -p dist-output
          # Collect NSIS setup installer / MSI from target bundle directory
          find target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" \) -exec cp -v {} dist-output/ \; || true
          # Also copy the standalone yaak.exe as portable if it exists
          if [ -f "target/release/yaak.exe" ]; then
            cp -v target/release/yaak.exe dist-output/yaak-portable.exe || true
          fi
          echo "=== Collected Windows artifacts ==="
          ls -la dist-output/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaak-windows-x64
          path: dist-output/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    if: github.event_name == 'push' || inputs.platform == 'all' || (inputs.platform != null && startsWith(inputs.platform, 'macos'))
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "arm64"
            target: "aarch64-apple-darwin"
          - arch: "x64"
            target: "x86_64-apple-darwin"
    steps:
      - name: Filter platform
        if: github.event_name == 'workflow_dispatch' && inputs.platform != 'all' && inputs.platform != format('macos-{0}', matrix.arch)
        run: echo "Skipping ${{ matrix.arch }} build" && exit 0

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-mac
          cache-on-failure: true

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: vp install

      - name: Bootstrap
        run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: ${{ matrix.arch }}

      - name: Build Tauri Bundle
        run: node scripts/run-build.mjs client --target ${{ matrix.target }} --config crates-tauri/yaak-app-client/tauri.release.conf.json --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles dmg

      - name: Inspect and collect macOS artifacts
        shell: bash
        run: |
          mkdir -p dist-output
          find target -type f -name "*.dmg" -exec cp -v {} dist-output/ \; || true
          if [ -z "$(ls -A dist-output 2>/dev/null)" ]; then
            find target -maxdepth 4 -type f -name "yaak" -exec cp -v {} dist-output/ \; || true
          fi
          echo "=== Collected macOS artifacts ==="
          ls -la dist-output/

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaak-macos-${{ matrix.arch }}
          path: dist-output/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    if: github.event_name == 'push' || inputs.platform == 'ubuntu-x64' || inputs.platform == 'all'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-linux
          cache-on-failure: true

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libnss3 patchelf xdg-utils
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18
          echo "CC_wasm32_unknown_unknown=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=/usr/bin/llvm-ar-18" >> "$GITHUB_ENV"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: vp install

      - name: Bootstrap
        run: npm run bootstrap
        env:
          YAAK_TARGET_ARCH: x64

      - name: Build Tauri Bundle
        run: node scripts/run-build.mjs client --config crates-tauri/yaak-app-client/tauri.release.conf.json --no-sign --config '{"bundle":{"createUpdaterArtifacts":false}}' --bundles deb,appimage

      - name: Inspect and collect Linux artifacts
        shell: bash
        run: |
          mkdir -p dist-output
          find target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp -v {} dist-output/ \; || true
          if [ -z "$(ls -A dist-output 2>/dev/null)" ]; then
            find target/release -maxdepth 1 -type f -name "yaak" -exec cp -v {} dist-output/ \; || true
          fi
          echo "=== Collected Linux artifacts ==="
          ls -la dist-output/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaak-linux-x64
          path: dist-output/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: always() && (github.event_name == 'push' || (inputs.create_release != null && inputs.create_release == true))
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-release/ \;
          ls -la dist-release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        with:
          files: dist-release/*
          tag_name: ${{ github.ref_name || 'latest-build' }}
          name: Yaak Release ${{ github.ref_name || 'Build' }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
